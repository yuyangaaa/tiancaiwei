name: Run Single Java File
on:
  push:
    branches: [ main ]
jobs:
  run-java:
    runs-on: ubuntu-latest
    steps:
      # 拉取你的仓库代码
      - uses: actions/checkout@v4
      # 安装JDK11
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # 编译你的Java文件（把文件名换成你实际的：登录界面.java）
      - name: Compile Java code
        run: javac LoginUI.java


      # 运行编译后的class程序
      - name: Run Java program
        run: java LoginUI
